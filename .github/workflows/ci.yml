name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build-wasm:
    name: build optimized WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target wasm32v1-none -p vesting
      - name: Report size, hash, and enforce budget
        run: |
          f=target/wasm32v1-none/release/vesting.wasm
          size=$(wc -c < "$f" | tr -d '[:space:]')
          max_bytes=23000
          echo "size: $size bytes (budget: $max_bytes bytes)"
          sha256sum "$f"
          if [ "$size" -gt "$max_bytes" ]; then
            echo "::error::WASM binary size ($size bytes) exceeds budget of $max_bytes bytes"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vesting-wasm
          path: target/wasm32v1-none/release/vesting.wasm

  deny:
    name: cargo-deny (bans, sources, licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources licenses

  advisories:
    name: cargo-deny (advisories, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
